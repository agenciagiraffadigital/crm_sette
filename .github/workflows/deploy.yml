name: Deploy to VPS

on:
  push:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build frontend
      run: npm run build
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 300s
        command_timeout: 600s
        script: |
          set -e
          
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "=== DEPLOY PRODUÇÃO ==="
            cd /var/www/crm_sette
            git reset --hard HEAD
            git clean -fd
            git pull origin master
            rm -rf node_modules package-lock.json
            npm install
            npm run build
            pm2 restart crm-webhook
            echo "=== PRODUÇÃO DEPLOYED ==="
          else
            echo "=== DEPLOY DESENVOLVIMENTO ==="
            cd /var/www/crm_sette_dev
            git reset --hard HEAD
            git clean -fd
            git pull origin develop
            
            # Criar .env.local para desenvolvimento
            echo "VITE_SUPABASE_URL=https://cmeusxhjciomrjhgpgzf.supabase.co" > .env.local
            echo "VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZXVzeGhqY2lvbXJqaGdwZ3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODY5NDMsImV4cCI6MjA4NTM2Mjk0M30.JyvCw90xQvNKl2JGIC37oknRekA37kDy0RTWWjuG6Y" >> .env.local
            echo "VITE_SUPABASE_DEV_URL=https://cmeusxhjciomrjhgpgzf.supabase.co" >> .env.local
            echo "VITE_SUPABASE_DEV_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZXVzeGhqY2lvbXJqaGdwZ3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3ODY5NDMsImV4cCI6MjA4NTM2Mjk0M30.JyvCw90xQvNKl2JGIC37oknRekA37kDy0RTWWjuG6Y" >> .env.local
            echo "VITE_SUPABASE_DEV_SERVICE_ROLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNtZXVzeGhqY2lvbXJqaGdwZ3pmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2OTc4Njk0MywiZXhwIjoyMDg1MzYyOTQzfQ.5_fvOMi936MZkeFyIVbiudrQwI5lusnl_gQyaLP_2po" >> .env.local
            
            rm -rf node_modules package-lock.json
            npm install
            npm run build
            pm2 restart crm-webhook-dev
            echo "=== DESENVOLVIMENTO DEPLOYED ==="
          fi
          
          sudo systemctl reload nginx