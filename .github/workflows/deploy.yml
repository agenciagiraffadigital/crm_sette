name: Deploy to VPS

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build frontend
      run: npm run build
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 300s
        command_timeout: 600s
        script: |
          set -e
          cd /var/www/crm_sette
          echo "=== ANTES DO PULL ==="
          git log -1 --oneline
          
          git pull origin master
          echo "=== DEPOIS DO PULL ==="
          git log -1 --oneline
          
          npm ci
          npm run build
          
          echo "=== VERIFICANDO ARQUIVOS ==="
          ls -la dist/
          ls -la dist/favicon.png || echo "Favicon não encontrado"
          
          pm2 restart crm-webhook
          sudo systemctl reload nginx
          
          echo "=== DEPLOY COMPLETED ==="