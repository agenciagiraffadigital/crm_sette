name: Deploy to VPS

on:
  push:
    branches: [ master, develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build frontend
      run: npm run build
      
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        timeout: 300s
        command_timeout: 600s
        script: |
          set -e
          
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "=== DEPLOY PRODUÇÃO ==="
            cd /var/www/crm_sette
            git reset --hard HEAD
            git clean -fd
            git pull origin master
            
            # Criar .env.local para PRODUÇÃO
            echo "VITE_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" > .env.local
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}" >> .env.local
            
            rm -rf node_modules package-lock.json
            npm install
            npm run build
            pm2 restart crm-webhook
            echo "=== PRODUÇÃO DEPLOYED ==="
          else
            echo "=== DEPLOY DESENVOLVIMENTO ==="
            cd /var/www/crm_sette_dev
            git reset --hard HEAD
            git clean -fd
            git pull origin develop
            
            # Criar .env.local para DESENVOLVIMENTO
            echo "VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" > .env.local
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}" >> .env.local
            
            rm -rf node_modules package-lock.json
            npm install
            npm run build
            pm2 restart crm-dev-frontend || pm2 serve /var/www/crm_sette_dev/dist 3001 --name "crm-dev-frontend" --spa
            pm2 save
            echo "=== DESENVOLVIMENTO DEPLOYED ==="
          fi
          
          sudo systemctl reload nginx