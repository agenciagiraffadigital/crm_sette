<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sette Saúde CRM - Online</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      
      /* Centralizar ícones e texto em botões */
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      
      /* Custom Scrollbar for boards */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fadeInUp 0.3s ease-out forwards;
      }
      .animate-fade-in {
        animation: fadeInUp 0.5s ease-out forwards;
      }

      .p-speeddial {
        position: static !important;
      }
      .p-speeddial-button {
        width: 2rem !important;
        height: 2rem !important;
      }

      /* Semi-circle usuarios - fixed com offset */
      .p-speeddial-list {
        position: fixed !important;
        z-index: 9999 !important;
        margin-top: -18px;
        margin-right: -50px;
      }

      /* SpeedDial operadoras - appendTo=self, relativo ao wrapper */
      .sd-operadoras-wrap .p-speeddial {
        position: relative !important;
      }
      .sd-operadoras-wrap .p-speeddial-list {
        position: absolute !important;
        margin-top: 0 !important;
        margin-right: 0 !important;
        z-index: 9999 !important;
      }

      .p-speeddial-list .p-speeddial-item a {
        background-color: #2563eb !important;
        color: white !important;
      }
      .p-speeddial-list .p-speeddial-item:first-child a {
        background-color: #dc2626 !important;
      }

      /* Dropdown manual transfer - border focus blue + highlight */
      .p-dropdown:not(.p-disabled).p-focus {
        border-color: #2563eb !important;
        box-shadow: 0 0 0 1px #2563eb !important;
      }
      .p-dropdown-item.p-highlight {
        background: #eff6ff !important;
        color: #1d4ed8 !important;
      }
      .p-dropdown .p-dropdown-trigger {
        width: 1.5rem !important;
      }
      .p-dropdown .p-dropdown-trigger .p-icon {
        width: 0.75rem !important;
        height: 0.75rem !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.5.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
